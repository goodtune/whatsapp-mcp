version: 2

builds:
  - id: whatsapp-mcp
    main: ./cmd/whatsapp-mcp
    binary: whatsapp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    targets:
      - linux_amd64
      - linux_arm64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    ids:
      - whatsapp-mcp
    files:
      - README.md
      - LICENSE

nfpms:
  - id: whatsapp-mcp
    package_name: whatsapp-mcp
    vendor: goodtune
    homepage: https://github.com/goodtune/whatsapp-mcp
    maintainer: Gary Reynolds <gary@touch.au>
    description: Multi-tenant WhatsApp MCP server with GitHub OAuth sign-in
    license: MIT
    formats:
      - rpm
    bindir: /usr/bin
    # send_audio_message converts audio with ffmpeg when it is installed.
    # Most RPM distributions only ship ffmpeg from third-party repositories
    # (e.g. RPM Fusion), so it is a weak dependency, not a hard one.
    suggests:
      - ffmpeg
    contents:
      # Like dotvault, this ships as a per-user service: the --*-dotvault
      # flags read secrets with the user's own cached dotvault login, and
      # its data lives in that user's state directory. Enable with
      # `systemctl --user enable --now whatsapp-mcp.service` (plus
      # `loginctl enable-linger <user>` to keep it running after logout).
      # /usr/lib/systemd/user/ is the canonical user-unit search path.
      - src: packaging/linux/whatsapp-mcp.service
        dst: /usr/lib/systemd/user/whatsapp-mcp.service
        file_info:
          mode: 0644

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
