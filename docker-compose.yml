services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: whatsapp_mcp
      POSTGRES_PASSWORD: whatsapp_mcp
      POSTGRES_DB: whatsapp_mcp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp_mcp"]
      interval: 5s
      timeout: 5s
      retries: 10

  whatsapp-mcp:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://whatsapp_mcp:whatsapp_mcp@postgres:5432/whatsapp_mcp?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a long random string}
      HTTP_ADDR: ":8080"
      MEDIA_DIR: /data/media
    ports:
      - "8080:8080"
    volumes:
      - media-data:/data/media

volumes:
  postgres-data:
  media-data:
