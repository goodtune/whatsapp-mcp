services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: whatsapp_mcp
      POSTGRES_PASSWORD: whatsapp_mcp
      POSTGRES_DB: whatsapp_mcp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp_mcp"]
      interval: 5s
      timeout: 5s
      retries: 10

  whatsapp-mcp:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://whatsapp_mcp:whatsapp_mcp@postgres:5432/whatsapp_mcp?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a long random string}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?set GITHUB_CLIENT_ID to your GitHub OAuth app's client ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?set GITHUB_CLIENT_SECRET to your GitHub OAuth app's client secret}
      GITHUB_ALLOWED_USERS: ${GITHUB_ALLOWED_USERS:?set GITHUB_ALLOWED_USERS to the GitHub logins allowed to sign in}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      HTTP_ADDR: ":8080"
      MEDIA_DIR: /data/media
      # Optional: set NGROK_AUTHTOKEN (in .env) to serve on a public ngrok
      # tunnel instead — see .env.example. The port mapping below is then
      # only needed for local access; it's harmless to leave either way.
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
    ports:
      - "8080:8080"
    volumes:
      - media-data:/data/media

volumes:
  postgres-data:
  media-data:
